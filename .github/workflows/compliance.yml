name: Infrastructure Compliance

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  compliance:
    name: Terraform Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov Security Scan
        run: >-
          checkov -d . --framework terraform
          --skip-path .venv
          --skip-check CKV2_AWS_62,CKV_AWS_18,CKV2_AWS_61,CKV_AWS_144,CKV_AWS_145

      - name: Install Conftest
        run: |
          curl -fL -o conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz
          sudo install conftest /usr/local/bin/conftest

      - name: Test compliant configuration
        run: conftest test tests/s3-private.json --policy policies

      - name: Ensure non-compliant configuration is rejected
        shell: bash
        run: |
          set +e
          output=$(conftest test tests/s3-public.json --policy policies 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ "$status" -eq 0 ]; then
            echo "ERROR: Non-compliant configuration was accepted."
            exit 1
          fi

          if ! echo "$output" | grep -Fq "un bucket S3 ne doit pas avoir une ACL public-read"; then
            echo "ERROR: Conftest failed for an unexpected reason."
            exit 1
          fi

          echo "SUCCESS: Non-compliant configuration was rejected by the expected policy."
